<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Services | Vista Venture Co.</title>

<style>
:root {
  --black:#050505;
  --gold:#C2A15A;
  --cream:#F5F5F3;
  --muted:rgba(245,245,243,.68);
  --green:#1F3D2B;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--black);
  color:var(--cream);
  font-family:Arial, sans-serif;
}

a { text-decoration:none; color:inherit; }

.nav {
  position:fixed;
  top:0;
  width:100%;
  padding:20px 5vw;
  display:flex;
  justify-content:space-between;
  background:rgba(5,5,5,.7);
  backdrop-filter:blur(12px);
}

.hero {
  height:80vh;
  display:flex;
  align-items:end;
  padding:120px 5vw 60px;
  position:relative;
}

.hero::before {
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.95)),
    url("https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../dji_fly.jpg");
  background-size:cover;
  z-index:-1;
}

h1 {
  font-size:clamp(50px,8vw,110px);
  line-height:.85;
}

.section {
  padding:80px 5vw;
}

/* BENTO GRID */
.bento {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:220px;
  gap:16px;
}

.tile {
  position:relative;
  border-radius:20px;
  overflow:hidden;
}

.tile img {
  height:100%;
  object-fit:cover;
  opacity:.8;
  transition:.5s;
}

.tile:hover img {
  transform:scale(1.08);
  opacity:1;
}

.tile::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent, rgba(0,0,0,.8));
}

.tile-content {
  position:absolute;
  bottom:20px;
  left:20px;
}

.tile.big { grid-column:span 2; grid-row:span 2; }
.tile.wide { grid-column:span 2; }
.tile.tall { grid-row:span 2; }

.tile h3 {
  font-size:28px;
}

.cta {
  text-align:center;
  padding:100px 20px;
}

.btn {
  display:inline-block;
  padding:14px 24px;
  border-radius:999px;
  background:var(--gold);
  color:black;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="nav">
  <a href="../">Vista Venture Co.</a>
  <div>
    <a href="../gallery/">Gallery</a>
    <a href="../contact/">Contact</a>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Everything you need to show your business properly.</h1>
  </div>
</section>

<!-- SERVICES GRID -->
<section class="section">
  <div class="bento">

    <a class="tile big" href="../real-estate/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../house.jpg">
      <div class="tile-content"><h3>Real Estate</h3></div>
    </a>

    <a class="tile tall" href="../vehicle-media/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../car.jpg">
      <div class="tile-content"><h3>Vehicles</h3></div>
    </a>

    <a class="tile" href="../land-acreage/">
      <img src="https://cdn.myportfolio.com/...jpg">
      <div class="tile-content"><h3>Land</h3></div>
    </a>

    <a class="tile" href="../construction-progress/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../construction.jpg">
      <div class="tile-content"><h3>Construction</h3></div>
    </a>

    <a class="tile wide" href="../business-content/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../food.jpg">
      <div class="tile-content"><h3>Business Content</h3></div>
    </a>

    <a class="tile" href="../event-coverage/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../event.jpg">
      <div class="tile-content"><h3>Events</h3></div>
    </a>

    <a class="tile" href="../portraits/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../portrait.jpg">
      <div class="tile-content"><h3>Portraits</h3></div>
    </a>

    <a class="tile" href="../web-design/">
      <img src="https://c9202c464af778ade582.cdn6.editmysite.com/uploads/b/.../website.jpg">
      <div class="tile-content"><h3>Web Design</h3></div>
    </a>

  </div>
</section>

<!-- CTA -->
<section class="cta">
  <h2>Not sure what you need?</h2>
  <p>Reach out and we can figure out the best setup for your project.</p>
  <a href="../contact/" class="btn">Contact Us</a>
</section>

</body>
</html>
