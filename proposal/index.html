<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Proposal Portal | Vista Venture Co.</title>

  <style>
    :root {
      --black:#050505;
      --cream:#F5F5F3;
      --gold:#C2A15A;
      --green:#1F3D2B;
      --muted:rgba(245,245,243,.68);
      --line:rgba(194,161,90,.25);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.9)),
        radial-gradient(circle at 30% 20%, rgba(194,161,90,.18), transparent 32%),
        radial-gradient(circle at 80% 70%, rgba(31,61,43,.32), transparent 34%),
        #050505;
      color:var(--cream);
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }

    .portal {
      width:min(760px, 100%);
      border:1px solid var(--line);
      border-radius:34px;
      padding:46px;
      background:rgba(255,255,255,.045);
      backdrop-filter:blur(18px);
      box-shadow:0 40px 120px rgba(0,0,0,.45);
    }

    .logo {
      font-size:13px;
      font-weight:900;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--gold);
      margin-bottom:34px;
    }

    h1 {
      font-size:clamp(46px,7vw,86px);
      line-height:.85;
      letter-spacing:-4px;
      text-transform:uppercase;
      margin-bottom:22px;
    }

    p {
      color:var(--muted);
      font-size:18px;
      line-height:1.6;
      max-width:620px;
      margin-bottom:30px;
    }

    .form-box {
      display:grid;
      gap:14px;
      margin-top:28px;
    }

    label {
      font-size:12px;
      font-weight:900;
      letter-spacing:1.5px;
      text-transform:uppercase;
      color:var(--gold);
    }

    input {
      width:100%;
      padding:18px 20px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.42);
      color:white;
      font-size:17px;
      outline:none;
    }

    input:focus {
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(194,161,90,.12);
    }

    button {
      margin-top:8px;
      border:none;
      border-radius:999px;
      padding:17px 24px;
      background:var(--gold);
      color:#080808;
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:1.4px;
      cursor:pointer;
      transition:.25s ease;
    }

    button:hover {
      transform:translateY(-3px);
      box-shadow:0 18px 40px rgba(194,161,90,.22);
    }

    .error {
      display:none;
      color:#ffb3b3;
      font-size:14px;
      margin-top:10px;
    }

    .hint {
      margin-top:26px;
      padding-top:24px;
      border-top:1px solid rgba(255,255,255,.09);
      color:rgba(245,245,243,.48);
      font-size:13px;
    }

    @media (max-width:700px) {
      .portal { padding:32px 24px; }
      h1 { letter-spacing:-2px; }
    }
  </style>
</head>

<body>

  <main class="portal">
    <div class="logo">Vista Venture Co.</div>

    <h1>Client Proposal Portal.</h1>

    <p>
      Enter the password provided with your proposal to view your custom project details,
      pricing, timeline, and next steps.
    </p>

    <div class="form-box">
      <label for="password">Proposal Password</label>
      <input id="password" type="password" placeholder="Enter password" autocomplete="off" />
      <button onclick="checkPassword()">View Proposal</button>
      <div id="error" class="error">That password does not match a proposal. Please try again.</div>
    </div>

    <div class="hint">
      Need help? Email info@vistaventureco.com
    </div>
  </main>

  <script>
    const proposals = {
      "bdg333ersofmo": "456789087.html",
      "school2026": "school-photo-day.html",
      "blockstreet2026": "block-street-records.html"
    };

    function checkPassword() {
      const input = document.getElementById("password").value.trim();
      const error = document.getElementById("error");

      if (proposals[input]) {
        window.location.href = proposals[input];
      } else {
        error.style.display = "block";
      }
    }

    document.getElementById("password").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
